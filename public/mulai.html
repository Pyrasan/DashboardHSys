<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mulai Deteksi</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>Mulai Deteksi Kendaraan</header>

<div class="container">

  <div class="card">
    <h3>Pilih Mode</h3>

    <button onclick="start('MASUK')">Mulai MASUK</button>
    <button onclick="start('KELUAR')">Mulai KELUAR</button>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

function start(mode) {
  socket.emit("start_deteksi", mode);
}
</script>

</body>
</html>
